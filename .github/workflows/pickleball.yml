name: Pickleball - Playwright Workflow
on:
  workflow_dispatch:
    inputs:
      scheduleUrl:
        description: "Url pointing to the sport schedule"
        required: true
        default: "https://perpetualmotion.org/pickleball-schedules-and-standings/"
      teamName:
        description: "Exact match team name to look for on the page"
        required: true
        default: "Interdimensional Pickle Beings"
      dayOfWeek:
        description: "Day of the week. This is used in-case teams on different days have duplicate names"
        required: true
        default: "Tuesday"
      calendarName:
        description: "Title of the calendar"
        required: true
        default: "Interdimensional Pickle Beings Pickleball"
      iCalFileName:
        description: "Outputs calendar file as <iCalFileName>.ics"
        required: true
        default: "interdimensional-pickle-beings"
  schedule:
    - cron: "0 0 * * 0" # every Sunday at midnight

env:
  TZ: America/Toronto

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm i
      - name: Run Playwright tests
        run: npx playwright test get-schedule
        env:
          SCHEDULE_URL: ${{ inputs.scheduleUrl || 'https://perpetualmotion.org/pickleball-schedules-and-standings/' }}
          TEAM_NAME: ${{ inputs.teamName || 'Interdimensional Pickle Beings' }}
          DAY_OF_WEEK: ${{ inputs.dayOfWeek || 'Tuesday' }}
          CALENDAR_NAME: ${{ inputs.calendarName || 'Interdimensional Pickle Beings Pickleball' }}
          ICAL_FILE_NAME: ${{ inputs.iCalFileName || 'interdimensional-pickle-beings' }}
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Auto-update ics changes
          file_pattern: "ics/*.ics"
